<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="02 Shipped">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C74FF"/><stop offset="55%" stop-color="#54C5F8"/><stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C74FF"/><stop offset="100%" stop-color="#54C5F8"/>
    </linearGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#54C5F8" stop-opacity="0"/><stop offset="100%" stop-color="#54C5F8" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }
      .s { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    </style>
  </defs>
  <clipPath id="hc"><rect width="900" height="56"/></clipPath>
  <rect x="2" y="10" width="40" height="26" rx="7" fill="url(#g)"/>
  <text class="m" x="22" y="28" font-size="13" font-weight="800" fill="#06101C" text-anchor="middle">02</text>
  <text class="s" x="58" y="31" font-size="24" font-weight="800" fill="#E6EDF3">Shipped</text>
  <text class="m" x="898" y="29" font-size="12" fill="#6B7280" text-anchor="end">// apps.dart</text>
  <rect x="0" y="46" width="900" height="1" fill="#1F2937"/>
  <g clip-path="url(#hc)"><rect y="45" width="180" height="3" rx="1.5" fill="url(#comet)">
    <animate attributeName="x" values="-180;900" dur="6.0s" repeatCount="indefinite"/></rect></g>
