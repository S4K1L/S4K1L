  <text class="s" x="24" y="68" font-size="12.5" style="fill:var(--muted)">One point of sale for furniture, supershop,</text><text class="s" x="24" y="86" font-size="12.5" style="fill:var(--muted)">cosmetic and local stores. The business type</text><text class="s" x="24" y="104" font-size="12.5" style="fill:var(--muted)">decides which features switch on.</text>
