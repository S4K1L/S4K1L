<svg xmlns="http://www.w3.org/2000/svg" width="440" height="168" viewBox="0 0 440 168" role="img" aria-label="Nexora">
  <defs>
    <style>
      :root { --bg:#0d1117; --panel:#161b22; --inset:#010409; --border:#30363d; --text:#e6edf3; --muted:#9198a1; --dim:#6e7681;
              --accent:#4493f8; --green:#3fb950;
              --kw:#ff7b72; --ty:#ffa657; --st:#a5d6ff; --fn:#d2a8ff; --an:#79c0ff; --pn:#9198a1; }
      @media (prefers-color-scheme: light) {
        :root { --bg:#ffffff; --panel:#f6f8fa; --inset:#eaeef2; --border:#d1d9e0; --text:#1f2328; --muted:#59636e; --dim:#818b98;
                --accent:#0969da; --green:#1a7f37;
                --kw:#cf222e; --ty:#953800; --st:#0a3069; --fn:#8250df; --an:#0550ae; --pn:#59636e; }
      }
      .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }
      .s { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    </style>
  </defs>
  <rect width="440" height="168" rx="12" style="fill:var(--panel)"/><rect x="0.5" y="0.5" width="439" height="167" rx="12" fill="none" style="stroke:var(--border)"/>
  <text class="s" x="24" y="40" font-size="20" font-weight="700" style="fill:var(--text)">Nexora</text>
  <text class="s" x="24" y="68" font-size="12.5" style="fill:var(--muted)">Inventory and point-of-sale for small retail</text><text class="s" x="24" y="86" font-size="12.5" style="fill:var(--muted)">businesses. Stock in, sales out.</text>
  <rect x="24" y="124" width="68" height="24" rx="12" fill="none" style="stroke:var(--border)"/><text class="m" x="58" y="140" font-size="11" text-anchor="middle" style="fill:var(--muted)">Flutter</text><rect x="100" y="124" width="82" height="24" rx="12" fill="none" style="stroke:var(--border)"/><text class="m" x="141" y="140" font-size="11" text-anchor="middle" style="fill:var(--muted)">Inventory</text><rect x="190" y="124" width="41" height="24" rx="12" fill="none" style="stroke:var(--border)"/><text class="m" x="211" y="140" font-size="11" text-anchor="middle" style="fill:var(--muted)">POS</text>
  <g transform="translate(366,24)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--accent)"><rect x="3" y="30" width="22" height="20" rx="3"/><rect x="29" y="30" width="22" height="20" rx="3"/><rect x="16" y="6" width="22" height="20" rx="3" fill-opacity="0.15" style="fill:var(--accent)"><animate attributeName="y" values="6;2;6" dur="2.4s" repeatCount="indefinite"/></rect></g>
  <text class="m" x="418" y="140" font-size="11.5" text-anchor="end" style="fill:var(--accent)">repo →</text>
