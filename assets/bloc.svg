<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" role="img" aria-label="BLoC data flow: the UI sends an event to the BLoC, which calls a repository, gets data back and emits a new state to the UI">
  <defs>
    <style>
      :root { --bg:#0d1117; --panel:#161b22; --inset:#010409; --border:#30363d; --text:#e6edf3; --muted:#9198a1; --dim:#6e7681;
              --accent:#4493f8; --green:#3fb950;
              --kw:#ff7b72; --ty:#ffa657; --st:#a5d6ff; --fn:#d2a8ff; --an:#79c0ff; --pn:#9198a1; }
      @media (prefers-color-scheme: light) {
        :root { --bg:#ffffff; --panel:#f6f8fa; --inset:#eaeef2; --border:#d1d9e0; --text:#1f2328; --muted:#59636e; --dim:#818b98;
                --accent:#0969da; --green:#1a7f37;
                --kw:#cf222e; --ty:#953800; --st:#0a3069; --fn:#8250df; --an:#0550ae; --pn:#59636e; }
      }
      .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }
      .s { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    </style>
  </defs>
<rect width="900" height="372" rx="14" style="fill:var(--panel)"/><rect x="0.5" y="0.5" width="899" height="371" rx="14" fill="none" style="stroke:var(--border)"/>
<text class="m" x="30" y="42" font-size="12" style="fill:var(--dim)">checkout flow, traced through the layers</text>
<path id="p0" d="M 200 130 L 365 130" fill="none" stroke-width="2" stroke-dasharray="5 5" style="stroke:var(--border)"/>
<path d="M 357 125 L 365 130 L 357 135" fill="none" stroke-width="2" style="stroke:var(--dim)"/>
<g opacity="0.4"><animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.04;0.06;0.3;0.34;1" dur="12.0s" repeatCount="indefinite"/><text class="m" x="282.5" y="118" font-size="11.5" font-weight="700" text-anchor="middle" style="fill:var(--accent)">ScanItem(sku)</text><text class="m" x="282.5" y="104" font-size="9.5" text-anchor="middle" style="fill:var(--dim)">event</text></g>
<circle r="5.5" opacity="0" style="fill:var(--accent)"><animateMotion dur="12.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.04;0.2;1" calcMode="linear"><mpath href="#p0"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.04;0.201;1" dur="12.0s" repeatCount="indefinite"/></circle>
<path id="p1" d="M 535 130 L 700 130" fill="none" stroke-width="2" stroke-dasharray="5 5" style="stroke:var(--border)"/>
<path d="M 692 125 L 700 130 L 692 135" fill="none" stroke-width="2" style="stroke:var(--dim)"/>
<g opacity="0.4"><animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.24;0.26;0.5;0.54;1" dur="12.0s" repeatCount="indefinite"/><text class="m" x="617.5" y="118" font-size="11.5" font-weight="700" text-anchor="middle" style="fill:var(--accent)">GET /products/42</text><text class="m" x="617.5" y="104" font-size="9.5" text-anchor="middle" style="fill:var(--dim)">request</text></g>
<circle r="5.5" opacity="0" style="fill:var(--accent)"><animateMotion dur="12.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.24;0.4;1" calcMode="linear"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.24;0.401;1" dur="12.0s" repeatCount="indefinite"/></circle>
<path id="p2" d="M 700 184 L 535 184" fill="none" stroke-width="2" stroke-dasharray="5 5" style="stroke:var(--border)"/>
<path d="M 543 179 L 535 184 L 543 189" fill="none" stroke-width="2" style="stroke:var(--dim)"/>
<g opacity="0.4"><animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.44;0.46;0.7;0.74;1" dur="12.0s" repeatCount="indefinite"/><text class="m" x="617.5" y="208" font-size="11.5" font-weight="700" text-anchor="middle" style="fill:var(--green)">Product(...)</text><text class="m" x="617.5" y="222" font-size="9.5" text-anchor="middle" style="fill:var(--dim)">data</text></g>
<circle r="5.5" opacity="0" style="fill:var(--green)"><animateMotion dur="12.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.44;0.6;1" calcMode="linear"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.44;0.601;1" dur="12.0s" repeatCount="indefinite"/></circle>
<path id="p3" d="M 365 184 L 200 184" fill="none" stroke-width="2" stroke-dasharray="5 5" style="stroke:var(--border)"/>
<path d="M 208 179 L 200 184 L 208 189" fill="none" stroke-width="2" style="stroke:var(--dim)"/>
<g opacity="0.4"><animate attributeName="opacity" values="0.4;0.4;1;1;0.4;0.4" keyTimes="0;0.64;0.66;0.9;0.94;1" dur="12.0s" repeatCount="indefinite"/><text class="m" x="282.5" y="208" font-size="11.5" font-weight="700" text-anchor="middle" style="fill:var(--green)">CartUpdated(total)</text><text class="m" x="282.5" y="222" font-size="9.5" text-anchor="middle" style="fill:var(--dim)">state</text></g>
<circle r="5.5" opacity="0" style="fill:var(--green)"><animateMotion dur="12.0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.64;0.8;1" calcMode="linear"><mpath href="#p3"/></animateMotion><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.64;0.801;1" dur="12.0s" repeatCount="indefinite"/></circle>
<rect x="30" y="92" width="170" height="116" rx="12" stroke-width="1.5" style="fill:var(--bg);stroke:var(--border)"/><rect x="30" y="92" width="170" height="116" rx="12" fill="none" stroke-width="2" opacity="0" style="stroke:var(--accent)"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.64;0.92;1" dur="12.0s" repeatCount="indefinite"/></rect><text class="s" x="115.0" y="132" font-size="20" font-weight="700" text-anchor="middle" style="fill:var(--text)">UI</text>
<text class="m" x="115.0" y="158" font-size="10.5" text-anchor="middle" style="fill:var(--muted)">Widgets</text>
<rect x="365" y="92" width="170" height="116" rx="12" stroke-width="1.5" style="fill:var(--bg);stroke:var(--border)"/><rect x="365" y="92" width="170" height="116" rx="12" fill="none" stroke-width="2" opacity="0" style="stroke:var(--accent)"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;1;0;0" keyTimes="0;0.04;0.26;0.44;0.66;1" dur="12.0s" repeatCount="indefinite"/></rect><text class="s" x="450.0" y="132" font-size="20" font-weight="700" text-anchor="middle" style="fill:var(--text)">BLoC</text>
<text class="m" x="450.0" y="158" font-size="10.5" text-anchor="middle" style="fill:var(--muted)">events → states</text>
<rect x="700" y="92" width="170" height="116" rx="12" stroke-width="1.5" style="fill:var(--bg);stroke:var(--border)"/><rect x="700" y="92" width="170" height="116" rx="12" fill="none" stroke-width="2" opacity="0" style="stroke:var(--accent)"><animate attributeName="opacity" calcMode="discrete" values="0;1;0;0" keyTimes="0;0.24;0.46;1" dur="12.0s" repeatCount="indefinite"/></rect><text class="s" x="785.0" y="132" font-size="20" font-weight="700" text-anchor="middle" style="fill:var(--text)">Repository</text>
<text class="m" x="785.0" y="158" font-size="10.5" text-anchor="middle" style="fill:var(--muted)">Django · FastAPI</text>
<text class="m" x="785.0" y="175" font-size="10.5" text-anchor="middle" style="fill:var(--muted)">Firebase · Supabase</text>
<text class="m" x="30" y="296" font-size="12" font-weight="700" style="fill:var(--accent)">01</text><text class="s" x="58" y="296" font-size="14" font-weight="600" style="fill:var(--text)">the UI only sends events</text>
<text class="m" x="320" y="296" font-size="12" font-weight="700" style="fill:var(--accent)">02</text><text class="s" x="348" y="296" font-size="14" font-weight="600" style="fill:var(--text)">the BLoC owns the logic</text>
<text class="m" x="610" y="296" font-size="12" font-weight="700" style="fill:var(--accent)">03</text><text class="s" x="638" y="296" font-size="14" font-weight="600" style="fill:var(--text)">data stays behind a repository</text>
<text class="m" x="30" y="334" font-size="12" style="fill:var(--dim)">events go in, immutable states come out. every screen is a function of the latest state.</text>
</svg>
